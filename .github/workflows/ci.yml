name: Build, test and validate

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Download pluginval 1.0.4
        run: |
          curl --fail --location \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip \
            --output pluginval.zip
          unzip -q pluginval.zip
          xattr -dr com.apple.quarantine pluginval.app || true
      - name: Configure Universal Release
        run: >-
          cmake --preset macos-release-universal
          -DSMART_DUCKING_PLUGINVAL_EXECUTABLE=${{ github.workspace }}/pluginval.app/Contents/MacOS/pluginval
      - name: Build and unit/factory test
        run: |
          cmake --build --preset macos-release-universal --parallel 4
          ctest --preset macos-release-universal --output-on-failure
      - name: pluginval strictness 5
        run: cmake --build --preset macos-release-universal --target SmartDuckingPluginval
      - name: Stage macOS VST3
        run: |
          mkdir -p dist
          ditto \
            "build-macos/release-universal/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" \
            "dist/Smart Ducking.vst3"
      - name: Upload macOS Universal VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-macOS-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-macos
          path: build-macos/release-universal/pluginval-results
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Download pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip `
            -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: Configure Release
        shell: pwsh
        run: >-
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          -DSMART_DUCKING_BUILD_TESTS=ON
          -DSMART_DUCKING_PLUGINVAL_EXECUTABLE="${{ github.workspace }}/pluginval/pluginval.exe"
      - name: Build and unit/factory test
        shell: pwsh
        run: |
          cmake --build build-ci --config Release --parallel 4
          ctest --test-dir build-ci -C Release --output-on-failure
      - name: pluginval strictness 5
        shell: pwsh
        run: cmake --build build-ci --config Release --target SmartDuckingPluginval
      - name: Stage Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item `
            -Recurse `
            -Force `
            "build-ci/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" `
            "dist/Smart Ducking.vst3"
      - name: Upload Windows x64 VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-windows
          path: build-ci/pluginval-results
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download pluginval 1.0.4
        run: |
          curl --fail --location \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip \
            --output pluginval.zip
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            ladspa-sdk \
            ninja-build \
            xauth \
            xvfb
      - name: Configure Linux x64 Release
        run: >-
          cmake --preset linux-release-x64
          -DSMART_DUCKING_PLUGINVAL_EXECUTABLE=${{ github.workspace }}/pluginval/pluginval
      - name: Build and unit/factory test
        run: |
          cmake --build --preset linux-release-x64 \
            --target SmartDucking_VST3 SmartDuckingTests SmartDuckingVST3FactoryTests \
            --parallel 4
          xvfb-run -a ctest --preset linux-release-x64 --output-on-failure
      - name: pluginval strictness 5
        timeout-minutes: 10
        run: >-
          xvfb-run -a cmake --build --preset linux-release-x64
          --target SmartDuckingPluginval
      - name: Stage Linux VST3
        run: |
          mkdir -p dist
          cp -R \
            "build-linux/release-x64/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" \
            "dist/Smart Ducking.vst3"
      - name: Upload Linux x64 VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-Linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-linux
          path: build-linux/release-x64/pluginval-results
          if-no-files-found: ignore

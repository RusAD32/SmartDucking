name: Build VST3 artifacts

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: [self-hosted, macOS, ARM64, repo-SmartDucking]
    steps:
      - uses: actions/checkout@v7
      - name: Configure Universal Release
        run: cmake --preset macos-release-universal
      - name: Build Universal Release and unit tests
        run: >-
          cmake --build --preset macos-release-universal
          --target SmartDucking_VST3 SmartDuckingTests SmartDuckingVST3FactoryTests
          --parallel 4
      - name: Run unit tests
        run: ctest --preset macos-release-universal
      - name: Stage macOS VST3
        run: |
          mkdir -p dist
          ditto \
            "build-macos/release-universal/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" \
            "dist/Smart Ducking.vst3"
      - name: Upload macOS Universal VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-macOS-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: [self-hosted, Windows, X64, repo-SmartDucking]
    steps:
      - uses: actions/checkout@v7
      - name: Configure Release
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: cmake --preset windows-vs2026
      - name: Build Release and unit tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: >-
          cmake --build --preset windows-release
          --target SmartDucking_VST3 SmartDuckingTests SmartDuckingVST3FactoryTests
          --parallel 4
      - name: Run unit tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: ctest --preset windows-release
      - name: Stage Windows VST3
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item `
            -Recurse `
            -Force `
            "build/windows-vs2026/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" `
            "dist/Smart Ducking.vst3"
      - name: Upload Windows x64 VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: [self-hosted, Linux, X64, repo-SmartDucking]
    steps:
      - uses: actions/checkout@v7
      - name: Ensure headless display tools
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xauth xvfb
          fi
      - name: Configure Linux x64 Release
        run: cmake --preset linux-release-x64
      - name: Build Release and unit tests
        run: >-
          cmake --build --preset linux-release-x64
          --target SmartDucking_VST3 SmartDuckingTests SmartDuckingVST3FactoryTests
          --parallel 4
      - name: Run unit tests
        run: xvfb-run -a ctest --preset linux-release-x64
      - name: Stage Linux VST3
        run: |
          mkdir -p dist
          cp -R \
            "build-linux/release-x64/SmartDucking_artefacts/Release/VST3/Smart Ducking.vst3" \
            "dist/Smart Ducking.vst3"
      - name: Upload Linux x64 VST3
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Ducking-VST3-Linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
